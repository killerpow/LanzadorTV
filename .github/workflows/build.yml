name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar firma (si existe el secreto)
        env:
          FIRMA_B64: ${{ secrets.FIRMA_B64 }}
        run: if [ -n "$FIRMA_B64" ]; then echo "$FIRMA_B64" | base64 -d > firma.jks; echo "Firma fija"; else echo "Sin firma fija"; fi
      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
          FIRMA_PASS: ${{ secrets.FIRMA_PASS }}
        run: gradle assembleDebug --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LanzadorTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LanzadorTV
          path: LanzadorTV.apk
      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Lanzador TV v${{ github.run_number }}
          files: LanzadorTV.apk
